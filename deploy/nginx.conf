# img.example.com 的 OpenResty 站点配置
#
# 用法：保留原站点里的 listen / ssl_certificate / ssl_certificate_key 等证书相关行，
# 其余内容（尤其是 location ~ \.php$、fastcgi_pass、include enable-php-*.conf、index index.php）全部删掉，
# 换成下面 server 块里的内容。
#
# root 写的是 OpenResty 看到的站点根目录（里面有 i 目录）。
# 1Panel 的 OpenResty 跑在容器里，容器内路径一般是 /www/sites/img.example.com/index；
# 宝塔或直接安装的一般是 /www/wwwroot/img.example.com。以原配置里的 root 为准。

server {
    listen 80;
    listen 443 ssl http2;
    server_name img.example.com;

    # ssl_certificate     ...;   # 保留原有证书配置
    # ssl_certificate_key ...;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 12m;

    # 原有和新上传的图片：OpenResty 直接返回静态文件，不经过任何程序
    location ^~ /i/ {
        root /www/sites/img.example.com/index;
        autoindex off;

        location ~* \.(jpe?g|png|gif|webp|bmp|ico|avif)$ {
            expires 30d;
            add_header X-Content-Type-Options nosniff always;
            add_header Access-Control-Allow-Origin * always;
            try_files $uri =404;
        }
        location ~* \.svg$ {
            expires 30d;
            add_header X-Content-Type-Options nosniff always;
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            try_files $uri =404;
        }
        # 图片以外的任何文件（包括可能残留的 .php 后门）一律 404
        return 404;
    }

    # 在后台开启了防盗链时，用下面这段替换上面整个 location ^~ /i/ { ... }，
    # 让图片也经过程序判断 Referer（程序同样只输出图片、不执行任何脚本）：
    #
    # location ^~ /i/ {
    #     proxy_pass http://127.0.0.1:18321;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # 旧的 /api/index.php、thumb.php 等地址也交给新程序处理，不再有 PHP 执行
    location ~* \.php$ {
        proxy_pass http://127.0.0.1:18321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:18321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
