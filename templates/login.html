{{template "head" "登录"}}
<main style="max-width:360px;margin-top:12vh">
  <form class="card" method="post" action="/login">
    <h2 style="margin:0 0 16px">登录 PicNook</h2>
    {{with .Error}}<p class="err">{{.}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <input type="password" name="password" placeholder="管理密码" autocomplete="current-password" autofocus required>
    <button class="primary" type="submit" style="width:100%;margin-top:14px;padding:8px">登录</button>
  </form>
</main>
{{template "foot"}}
