{{template "head" "上传"}}
{{template "nav"}}
<style>
.drop{position:relative;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:34px 36px;border-radius:calc(var(--radius) + 4px);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s}
.drop::after{content:"";position:absolute;inset:10px;border:1.5px dashed var(--line-2);border-radius:var(--radius);pointer-events:none;transition:border-color .2s,inset .2s}
.drop:hover::after,.drop:focus-visible::after{border-color:var(--accent)}
.drop.over{transform:scale(1.005);box-shadow:var(--shadow-lg)}
.drop.over::after{border-color:var(--accent);border-style:solid;inset:6px;background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.drop:focus-visible{outline:0}
.arch{width:104px;height:124px;border-radius:52px 52px 8px 8px;background:var(--accent);position:relative;box-shadow:inset 0 -18px 0 rgba(0,0,0,.08);transition:transform .3s cubic-bezier(.3,.7,.4,1.4)}
.drop:hover .arch,.drop.over .arch{transform:translateY(-4px) rotate(-2deg)}
.arch::before{content:"";position:absolute;left:18px;right:18px;bottom:22px;height:40px;background:var(--card);clip-path:polygon(0 100%,32% 28%,55% 70%,70% 45%,100% 100%)}
.arch::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:var(--card);top:40px;right:28px}
.drop h2{font-size:28px;line-height:1.2;margin-bottom:8px}
.drop p{margin:0;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.key{font:500 12.5px/1 var(--sans);padding:6px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
kbd{font-family:var(--mono);font-size:11.5px;padding:1px 5px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:var(--card)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 14px;flex-wrap:wrap}
.toolbar h3{font-size:19px}
.toolbar h3 small{font:500 13px var(--sans);color:var(--muted);margin-left:8px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font:500 13px/1 var(--sans);color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

#results{display:grid;gap:12px}
.empty{text-align:center;color:var(--muted);padding:36px 16px;border:1px dashed var(--line-2);border-radius:var(--radius);font-size:14px}
.item{display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);animation:rise .35s cubic-bezier(.2,.7,.3,1) both}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--paper-2) repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/14px 14px;display:block}
.meta{min-width:0}
.meta-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{color:var(--muted);font-size:12.5px;white-space:nowrap}
.bar{height:4px;border-radius:4px;background:var(--paper-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.status{margin-top:8px;font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
.out{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.out .btn{padding-top:0;padding-bottom:0;border-radius:var(--radius-sm)}
.out input{font-family:var(--mono);font-size:12.5px;padding:8px 10px;background:var(--paper)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font:500 12px/1 var(--sans);padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:720px){
  .drop{grid-template-columns:1fr;text-align:center;padding:28px 20px}
  .arch{margin:0 auto;width:84px;height:100px}
  .keys{justify-content:center}
  .drop h2{font-size:23px}
  .item{grid-template-columns:56px 1fr;gap:12px}
  .thumb{width:56px;height:56px}
}
</style>
<main class="wrap">
  <div class="drop rise" id="drop" tabindex="0" role="button" aria-label="选择要上传的图片">
    <div class="arch" aria-hidden="true"></div>
    <div>
      <span class="eyebrow">Upload</span>
      <h2>把图片放进来</h2>
      <p>拖拽到这里、直接粘贴，或者点击选择，可以一次选多张。</p>
      <div class="keys">
        <span class="key">JPG · PNG · GIF · WebP</span>
        <span class="key">单张 ≤ {{.MaxMB}} MB</span>
        <span class="key"><kbd>⌘</kbd> / <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴上传</span>
      </div>
    </div>
  </div>
  <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>

  <div class="toolbar rise rise-2">
    <h3>本次上传<small id="count"></small></h3>
    <div class="tools">
      <div class="seg" id="fmt" role="tablist" aria-label="复制格式">
        <button type="button" data-fmt="url">直链</button>
        <button type="button" data-fmt="md">Markdown</button>
        <button type="button" data-fmt="html">HTML</button>
        <button type="button" data-fmt="bb">BBCode</button>
      </div>
      <button type="button" class="btn btn-sm" id="copyall" disabled>复制全部</button>
      <button type="button" class="btn btn-sm btn-ghost" id="clear" disabled>清空</button>
    </div>
  </div>
  <div id="results"><div class="empty rise rise-3" id="empty">上传后的链接会出现在这里，刷新页面后会清空</div></div>
</main>
<script>
(function () {
  var drop = document.getElementById('drop');
  var input = document.getElementById('file');
  var results = document.getElementById('results');
  var empty = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var copyAll = document.getElementById('copyall');
  var clearBtn = document.getElementById('clear');
  var FMT_LABEL = { url: '直链', md: 'Markdown', html: 'HTML', bb: 'BBCode' };
  var fmt = 'url';
  try { fmt = localStorage.getItem('picnook.fmt') || 'url'; } catch (e) {}
  var done = [];          // 已上传成功的 {url, alt, render}
  var queue = [], active = 0, total = 0;

  function build(f, url, alt) {
    var a = alt.replace(/[\[\]()<>"]/g, '');
    switch (f) {
      case 'md': return '![' + a + '](' + url + ')';
      case 'html': return '<img src="' + url + '" alt="' + a + '">';
      case 'bb': return '[img]' + url + '[/img]';
      default: return url;
    }
  }
  function setFmt(f) {
    fmt = FMT_LABEL[f] ? f : 'url';
    try { localStorage.setItem('picnook.fmt', fmt); } catch (e) {}
    document.querySelectorAll('#fmt button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.fmt === fmt);
      b.setAttribute('aria-selected', b.dataset.fmt === fmt);
    });
    done.forEach(function (d) { d.render(); });
  }
  function updateCount() {
    countEl.textContent = total ? '成功 ' + done.length + ' / 共 ' + total : '';
    copyAll.disabled = done.length === 0;
    clearBtn.disabled = total === 0 || active > 0;
  }
  function human(n) {
    return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function add(file) {
    if (empty) { empty.remove(); empty = null; }
    total++;
    var card = el('div', 'item');
    var img = el('img', 'thumb'); img.alt = ''; img.src = URL.createObjectURL(file);
    var meta = el('div', 'meta');
    var top = el('div', 'meta-top');
    top.append(el('div', 'fname', file.name), el('div', 'fsize', human(file.size)));
    var bar = el('div', 'bar'), fill = el('i'); bar.append(fill);
    var status = el('div', 'status', '排队中…');
    meta.append(top, bar, status);
    card.append(img, meta);
    results.prepend(card);
    queue.push({ file: file, card: card, meta: meta, fill: fill, bar: bar, status: status });
    updateCount();
    pump();
  }

  function pump() {
    while (active < 3 && queue.length) send(queue.shift());
  }

  function send(job) {
    active++;
    job.status.textContent = '上传中…';
    var fd = new FormData();
    fd.append('image', job.file);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) job.fill.style.width = Math.round(e.loaded / e.total * 100) + '%';
    };
    xhr.onload = function () {
      var d = null;
      try { d = JSON.parse(xhr.responseText); } catch (e) {}
      finish(job, d);
    };
    xhr.onerror = function () { finish(job, null); };
    xhr.send(fd);
  }

  function finish(job, d) {
    active--;
    if (!d || d.result !== 'success') {
      job.bar.remove();
      job.status.className = 'status err';
      job.status.textContent = (d && d.message) || '网络错误，上传失败';
      if (d && d.code === 401) location.href = '/login';
      updateCount(); pump(); return;
    }
    job.fill.style.width = '100%';
    setTimeout(function () { job.bar.remove(); }, 300);
    job.status.remove();
    var alt = d.srcName || '';
    var out = el('div', 'out');
    var field = el('input'); field.type = 'text'; field.readOnly = true;
    field.addEventListener('focus', function () { field.select(); });
    var btn = el('button', 'btn btn-primary btn-sm', '复制'); btn.type = 'button';
    btn.addEventListener('click', function () { copyText(field.value, '已复制' + FMT_LABEL[fmt]); });
    out.append(field, btn);
    var chips = el('div', 'chips');
    var entry = { url: d.url, alt: alt, render: function () {
      field.value = build(fmt, d.url, alt);
      chips.textContent = '';
      Object.keys(FMT_LABEL).forEach(function (f) {
        if (f === fmt) return;
        var c = el('button', 'chip', '复制 ' + FMT_LABEL[f]); c.type = 'button';
        c.addEventListener('click', function () { copyText(build(f, d.url, alt), '已复制' + FMT_LABEL[f]); });
        chips.append(c);
      });
      var o = el('a', 'chip', '打开'); o.href = d.url; o.target = '_blank'; o.rel = 'noopener';
      chips.append(o);
    } };
    entry.render();
    job.meta.append(out, chips);
    done.push(entry);
    updateCount(); pump();
  }

  function handle(files) {
    for (var i = 0; i < files.length; i++) {
      if (files[i] && files[i].type.indexOf('image/') === 0) add(files[i]);
    }
  }

  document.getElementById('fmt').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-fmt]');
    if (b) setFmt(b.dataset.fmt);
  });
  copyAll.addEventListener('click', function () {
    var lines = done.slice().reverse().map(function (d) { return build(fmt, d.url, d.alt); });
    copyText(lines.join('\n'), '已复制 ' + lines.length + ' 条' + FMT_LABEL[fmt]);
  });
  clearBtn.addEventListener('click', function () {
    results.textContent = ''; done = []; total = 0;
    empty = el('div', 'empty', '上传后的链接会出现在这里，刷新页面后会清空'); empty.id = 'empty';
    results.append(empty); updateCount();
  });
  drop.addEventListener('click', function () { input.click(); });
  drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  input.addEventListener('change', function () { handle(input.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    document.addEventListener(t, function (e) {
      if (t === 'dragleave' && e.relatedTarget) return;
      drop.classList.remove('over');
    });
  });
  document.addEventListener('drop', function (e) { e.preventDefault(); handle(e.dataTransfer.files); });
  document.addEventListener('paste', function (e) {
    var files = [], items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) if (items[i].kind === 'file') files.push(items[i].getAsFile());
    if (files.length) { e.preventDefault(); handle(files); }
  });
  setFmt(fmt);
  updateCount();
})();
</script>
{{template "foot"}}
