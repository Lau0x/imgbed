{{define "head"}}<!doctype html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>{{t .}} · PicPier</title>
<script>try{var m=localStorage.getItem('picpier.theme');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m)}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 28V14a10 10 0 0 1 20 0v14z' fill='%232563eb'/%3E%3Cpath d='M10 24l4.5-6 3.5 4 2-2.5 3 4.5z' fill='%23fffdf8'/%3E%3Ccircle cx='19.5' cy='13.5' r='2' fill='%23fffdf8'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f4f7fb;--paper-2:#eaf0f7;--card:#ffffff;--ink:#0f1b2d;--ink-2:#334155;--muted:#64748b;
  --line:#e3e9f1;--line-2:#cfd8e3;--accent:#2563eb;--accent-2:#1d4ed8;--accent-soft:#e7efff;--on-accent:#ffffff;
  --ok:#15803d;--ok-soft:#e2f5e9;--danger:#dc2626;--danger-soft:#fde8e8;--warn:#b45309;--warn-soft:#fdf1dc;
  --shadow:0 1px 2px rgba(15,27,45,.04),0 8px 24px -14px rgba(15,27,45,.18);
  --shadow-lg:0 2px 4px rgba(15,27,45,.05),0 24px 48px -22px rgba(15,27,45,.32);
  --radius:14px;--radius-sm:9px;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"JetBrains Mono","SF Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
/* 深色：手动选择深色，或跟随系统且系统是深色 */
:root[data-theme=dark]{
  --paper:#0b1220;--paper-2:#121c2e;--card:#0f1829;--ink:#e6edf7;--ink-2:#c3cfe0;--muted:#8a9ab3;
  --line:#1d2a40;--line-2:#2a3a55;--accent:#4f8cff;--accent-2:#79a8ff;--accent-soft:#15254a;--on-accent:#ffffff;
  --ok:#4ade80;--ok-soft:#10301f;--danger:#f87171;--danger-soft:#3a1717;--warn:#fbbf24;--warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 48px -22px rgba(0,0,0,.85);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0b1220;--paper-2:#121c2e;--card:#0f1829;--ink:#e6edf7;--ink-2:#c3cfe0;--muted:#8a9ab3;
  --line:#1d2a40;--line-2:#2a3a55;--accent:#4f8cff;--accent-2:#79a8ff;--accent-soft:#15254a;--on-accent:#ffffff;
  --ok:#4ade80;--ok-soft:#10301f;--danger:#f87171;--danger-soft:#3a1717;--warn:#fbbf24;--warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 48px -22px rgba(0,0,0,.85);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.65 var(--sans);background-color:var(--paper);
  background-image:radial-gradient(1100px 420px at 50% -160px,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(color-mix(in srgb,var(--line-2) 70%,transparent) 1px,transparent 1.2px);
  background-size:100% 100%,22px 22px;background-attachment:fixed;}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-2)}
::selection{background:var(--accent-soft)}
h1,h2,h3,h4{font-family:var(--display);font-weight:650;letter-spacing:-.01em;margin:0}
code,.mono{font-family:var(--mono);font-size:.86em}
code{background:var(--paper-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font:700 19px/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.brand:hover{color:var(--ink)}
.brand svg{width:28px;height:28px;flex:none}
.brand em{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:4px;align-items:center}
.nav a,.nav button{position:relative;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;color:var(--ink-2);font:500 14px/1 var(--sans);background:none;border:0;cursor:pointer;transition:background .15s,color .15s}
.nav svg{width:17px;height:17px;flex:none}
.nav a:hover{background:var(--paper-2);color:var(--ink)}
.nav button:hover{background:var(--paper-2);color:var(--ink)}
.nav .logout:hover{background:var(--danger-soft);color:var(--danger)}
.prefs{display:flex;gap:2px;align-items:center}
.pref{display:inline-grid;place-items:center;min-width:36px;height:34px;padding:0 9px;border-radius:999px;border:0;background:none;color:var(--ink-2);font:650 12.5px/1 var(--sans);cursor:pointer;transition:background .15s,color .15s}
.pref:hover{background:var(--paper-2);color:var(--ink)}
.pref svg{width:17px;height:17px;display:none}
.pref[data-mode=auto] .i-auto,.pref[data-mode=light] .i-light,.pref[data-mode=dark] .i-dark{display:block}
.prefs-float{position:fixed;top:14px;right:16px;z-index:20;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.credit{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 28px;margin-top:-40px}
.credit a{color:inherit;text-decoration:none}
.credit a:hover{color:var(--accent)}
.credit.fixed{position:fixed;left:0;right:0;bottom:0;margin:0;padding-bottom:16px}
.nav a.on,.nav a.on:hover{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
.nav form{margin:0}
.nav .sep{width:1px;height:22px;background:var(--line);margin:0 6px}

/* 版心 */
.wrap{max-width:1180px;margin:0 auto;padding:36px 24px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:32px;line-height:1.15}
.page-head .sub{color:var(--muted);margin-top:6px;font-size:14px}
.eyebrow{display:inline-block;font:600 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.card-title{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.card-title h2,.card-title h3{font-size:20px}
.card .desc{color:var(--muted);font-size:14px;margin:0 0 18px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:500 14px/1 var(--sans);padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .08s,background .15s,border-color .15s,color .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn-ink:hover{color:var(--paper);opacity:.9}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--paper-2);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer}

/* 表单 */
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:96px;resize:vertical;font-size:13px}
input[type=number]{width:110px}
.input-mono{font-family:var(--mono);font-size:12.5px}

/* 拨动开关：仍是 checkbox，只换外观 */
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line-2);position:relative;margin:0;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(17px)}
.switch input:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}

/* 徽章 */
.badge{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 var(--sans);padding:4px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-bad{background:var(--danger-soft);color:var(--danger)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}

/* 提示 */
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--ink);font-size:14px;margin-bottom:22px;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.notice-warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger)}
.warn-text{color:var(--warn);font-size:13px}

/* 浮动提示 */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:100}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 入场动画 */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
.rise-1{animation-delay:.04s}.rise-2{animation-delay:.1s}.rise-3{animation-delay:.16s}.rise-4{animation-delay:.22s}.rise-5{animation-delay:.28s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:480px){.nav .t{display:none}.nav a,.nav button{padding:9px}}
@media (max-width:720px){
  .topbar-in{padding:10px 16px;gap:10px}
  .brand span{display:none}
  .nav a,.nav button{padding:8px 10px}
  .nav .sep{margin:0 2px}
  .pref{min-width:32px;padding:0 6px}
  .wrap{padding:24px 16px 64px}
  .page-head h1{font-size:26px}
  .card{padding:18px}
}
</style>
</head>
<body>
{{end}}

{{define "brandmark"}}<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 28V14a10 10 0 0 1 20 0v14z" fill="var(--accent)"/><path d="M10 24l4.5-6 3.5 4 2-2.5 3 4.5z" fill="var(--card)"/><circle cx="19.5" cy="13.5" r="2" fill="var(--card)"/></svg>{{end}}

{{define "credit"}}<footer class="credit {{.}}"><a href="https://github.com/Lau0x/picpier" target="_blank" rel="noopener">PicPier {{version}} · GitHub</a></footer>{{end}}

{{define "prefs"}}<div class="prefs">
  <button type="button" class="pref" data-theme-btn data-mode="auto" title="{{t "主题：跟随系统"}}" aria-label="{{t "主题：跟随系统"}}"><svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg><svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
  <button type="button" class="pref" data-lang-btn data-next="{{if eq lang "en"}}zh{{else}}en{{end}}" title="{{t "切换到英文"}}">{{if eq lang "en"}}中{{else}}EN{{end}}</button>
</div>{{end}}

{{define "nav"}}
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/">{{template "brandmark"}}<span>Pic<em>Pier</em></span></a>
    <nav class="nav">
      <a href="/" data-nav="/" title="{{t "上传"}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span class="t">{{t "上传"}}</span></a>
      <a href="/admin" data-nav="/admin" title="{{t "图片"}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M21 15.5l-4.5-4.5L7 20"/></svg><span class="t">{{t "图片"}}</span></a>
      <a href="/admin/settings" data-nav="/admin/settings" title="{{t "设置"}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="t">{{t "设置"}}</span></a>
      <span class="sep" aria-hidden="true"></span>
      {{template "prefs"}}
      <form method="post" action="/logout"><button type="submit" class="logout" title="{{t "退出"}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l4-4-4-4M14 12H4"/></svg><span class="t">{{t "退出"}}</span></button></form>
    </nav>
  </div>
</header>
{{end}}

{{define "foot"}}
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var p = location.pathname, best = null;
  document.querySelectorAll('[data-nav]').forEach(function (a) {
    var n = a.getAttribute('data-nav');
    if ((n === '/' && p === '/') || (n !== '/' && p.indexOf(n) === 0)) {
      if (!best || n.length > best.getAttribute('data-nav').length) best = a;
    }
  });
  if (best) best.classList.add('on');
  var t, el = document.getElementById('toast');
  window.toast = function (msg) {
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(t);
    t = setTimeout(function () { el.classList.remove('show'); }, 1600);
  };
  window.copyText = function (text, msg) {
    var done = function () { toast(msg || {{t "已复制"}}); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast({{t "复制失败，请手动复制"}}); }
      ta.remove();
    }
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (b) { e.preventDefault(); copyText(b.getAttribute('data-copy'), b.getAttribute('data-copy-msg')); }
  });

  // 主题：跟随系统 → 浅色 → 深色，保存在本地
  var TL = { auto: {{t "主题：跟随系统"}}, light: {{t "主题：浅色"}}, dark: {{t "主题：深色"}} };
  function theme() { try { return localStorage.getItem('picpier.theme') || 'auto'; } catch (e) { return 'auto'; } }
  function applyTheme(m) {
    if (m === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', m);
    document.querySelectorAll('[data-theme-btn]').forEach(function (b) {
      b.setAttribute('data-mode', m); b.title = TL[m]; b.setAttribute('aria-label', TL[m]);
    });
  }
  applyTheme(theme());
  document.querySelectorAll('[data-theme-btn]').forEach(function (b) {
    b.addEventListener('click', function () {
      var order = ['auto', 'light', 'dark'], m = order[(order.indexOf(theme()) + 1) % 3];
      try { localStorage.setItem('picpier.theme', m); } catch (e) {}
      applyTheme(m); toast(TL[m]);
    });
  });
  // 语言：写入 cookie 后刷新
  document.querySelectorAll('[data-lang-btn]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.cookie = 'lang=' + b.getAttribute('data-next') + '; path=/; max-age=31536000; samesite=lax';
      location.reload();
    });
  });
})();
</script>
</body>
</html>
{{end}}
