services:
  imgbed:
    image: ghcr.io/lau0x/imgbed:latest
    container_name: imgbed
    restart: unless-stopped
    # 容器以这个用户身份读写图片，要和图片目录的属主一致（迁移时用 stat -c '%u:%g' 旧的i目录 查看）
    user: "${IMGBED_UID:-1000}:${IMGBED_GID:-1000}"
    env_file: .env
    ports:
      # 只监听本机，由宿主机上的 Nginx / OpenResty / Caddy 反向代理并提供 HTTPS
      - "127.0.0.1:18321:18321"
    volumes:
      # 全新安装：图片存在 ./data/i，删除的图片在 ./data/i-trash
      - ./data:/data
      # 从 EasyImage 迁移：注释掉上面一行，改成挂载原站点的 i 目录
      # - /原站点根目录/i:/data/i
      # - ./i-trash:/data/i-trash
